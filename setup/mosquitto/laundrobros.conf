# Mosquitto listener for the ESP32 (esp32/tof_gripper_bridge).
# Install: see README.md next to this file.
#
# Mosquitto 2 only listens on localhost unless told otherwise, and the
# ESP32 connects from the LAN. No password, so the firewall must only
# let the rig's network in (README.md, Firewall): this listens on
# every interface, the campus WiFi included.

listener 1883 0.0.0.0
allow_anonymous true

# Send small packets (clock sync pings, readings) at once instead of
# batching them (Nagle's algorithm), which would add delay.
set_tcp_nodelay true
